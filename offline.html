<script>
(function(){
  // A2: short-circuit on known crawlers/automation/headless before gtag init.
  // Covers AI training bots (GPTBot, ClaudeBot, anthropic-ai, PerplexityBot,
  // CCBot, Google-Extended, Bytespider, etc.), SEO spiders (Ahrefs, Semrush,
  // MJ12, DotBot), search bots (Baidu, Yandex, Apple, Amazon), automation
  // frameworks (Playwright, Puppeteer, Selenium via webdriver flag), CLI
  // fetchers (curl, wget, python, node-fetch, axios), and lighthouse/insights.
  var ua = navigator.userAgent || '';
  var BOT_RE = /(bot|spider|crawl|slurp|teoma|monitor|headless|playwright|puppeteer|selenium|electron|preview|fetcher|inspect|lighthouse|pagespeed|gtmetrix|httrack|wget|curl|python-requests|axios|node-fetch|go-http|libwww|scrapy|chatgpt|gptbot|claudebot|anthropic|perplexity|cohere|bytespider|ahrefs|semrush|mj12|dotbot|baidu|yandex|ccbot|google-extended|amazonbot|applebot|facebot|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|discordbot|skype|slackbot|embedly|bingpreview)/i;
  if (BOT_RE.test(ua) || navigator.webdriver === true) {
    window.gtag = function(){};
    return;
  }

  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  window.gtag = gtag;

  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'analytics_storage': 'granted',
    'functionality_storage': 'granted',
    'security_storage': 'granted',
    'wait_for_update': 500
  });
  gtag('js', new Date());

  // A1: prerender gate. Speculation Rules + Chrome anonymous prerender load
  // pages invisibly, run all JS, and most never become a real visit. Defer
  // gtag('config') AND the gtag.js script load until prerenderingchange so
  // page_view fires only when the user actually navigates.
  function fireConfig(){
    gtag('config', 'G-0ZKDQP9DNH');
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-0ZKDQP9DNH';
    document.head.appendChild(s);
  }
  if (document.prerendering) {
    document.addEventListener('prerenderingchange', fireConfig, { once: true });
  } else {
    fireConfig();
  }
})();

<script>
  // v37.32 — replaces previous inline onclick=location.reload() which was
  // blocked by the hash-based CSP (script-src has no 'unsafe-inline').
  document.getElementById('retryConnection').addEventListener('click', function () {
    location.reload();
  });
  // Auto-reload when the browser regains connectivity.
  window.addEventListener('online', function () { location.reload(); });

  // v37.32 — populate the cached-page list dynamically from the SW cache so
  // it always reflects what the user can actually read offline (not a stale
  // hard-coded 3-item list). Fails silently if Cache API isn't available
  // (very old browsers) or no SW is installed (first visit).
  (function () {
    if (!('caches' in window)) return;
    var listEl = document.getElementById('cached-list');
    if (!listEl) return;
    // Honour the user's saved language preference (set on regular pages by
     //  blog-shared.js / lang-select dropdown). Default to ZH since the HTML
     //  is authored in zh-Hant-TW.
    var saved = '';
    try { saved = localStorage.getItem('hs:lang') || ''; } catch (e) { /* private mode */ }
    var lang = saved.toLowerCase().startsWith('en') ? 'en'
             : (document.documentElement.lang || 'zh').toLowerCase().startsWith('en') ? 'en'
             : 'zh';
    // Apply lang to all [data-zh][data-en] elements on first paint.
    // Use textContent (stripping tags) instead of innerHTML so we don't
    // trigger Trusted Types policy enforcement on this minimal page.
    if (lang === 'en') {
      document.querySelectorAll('[data-en]').forEach(function (el) {
        var v = el.getAttribute('data-en');
        if (v) el.textContent = v.replace(/<[^>]*>/g, '').replace(/&[a-z]+;/g, ' ');
      });
      document.documentElement.setAttribute('lang', 'en');
    }
    var ORIGIN = location.origin;
    // Article slug → display name (ZH / EN). Mirrors DN.ARTICLES; kept tiny
    // here so this page can render offline without loading blog-shared.js.
    var NAMES = {
      '/': { zh: '首頁', en: 'Home' },
      '/blog/': { zh: '衛教文章索引', en: 'Article index' },
      '/about': { zh: '關於我', en: 'About' },
      '/tools': { zh: '眼科自我評估工具', en: 'Self-assessment tools' },
      '/blog/dry-eye-myths': { zh: '乾眼症 8 大迷思', en: '8 Dry-Eye Myths' },
      '/blog/floaters-retinal-detachment': { zh: '飛蚊症 6 大警訊', en: '6 Floater Red Flags' },
      '/blog/pediatric-myopia-control': { zh: '兒童近視控制', en: 'Pediatric Myopia Control' },
      '/blog/cataract-comprehensive-guide': { zh: '白內障完整衛教', en: 'Cataract Guide' },
      '/blog/glaucoma-comprehensive-guide': { zh: '青光眼完整衛教', en: 'Glaucoma Guide' },
    };
    caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (k) { return caches.open(k).then(function (c) { return c.keys(); }); }));
    }).then(function (bucketLists) {
      var seen = {};
      bucketLists.forEach(function (reqs) {
        reqs.forEach(function (r) {
          try {
            var u = new URL(r.url);
            if (u.origin !== ORIGIN) return;
            var p = u.pathname.replace(/\.html$/, '');
            if (p === '/index') p = '/';
            if (seen[p]) return;
            seen[p] = true;
          } catch (e) { /* ignore malformed */ }
        });
      });
      var paths = Object.keys(seen)
        .filter(function (p) { return NAMES[p]; })
        .sort(function (a, b) { return a === '/' ? -1 : b === '/' ? 1 : a.localeCompare(b); });
      if (!paths.length) return;
      var frag = document.createDocumentFragment();
      paths.forEach(function (p) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = p;
        a.textContent = NAMES[p][lang] || NAMES[p].zh;
        li.appendChild(a);
        frag.appendChild(li);
      });
      listEl.replaceChildren(frag);
    }).catch(function () { /* silently keep fallback list */ });
  })();
</script>
