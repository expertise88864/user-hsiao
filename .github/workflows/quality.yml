name: quality

# Quality gates for HsiaoEye:
#   1. validate.py — title / description / canonical / OG / Twitter / hreflang /
#                    JSON-LD / img alt+dimensions / internal links
#   2. JSON-LD parse check (separate, deeper)
#   3. Lighthouse CI on production URL after Vercel deploy
#
# To enable Lighthouse on PRs against Vercel preview deploys, set the
# repository secret VERCEL_PREVIEW_URL or use the official Vercel Action.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HTML validation + SEO check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow beautifulsoup4

      # v37.17 — RUN HALFWIDTH FIX FIRST. Order matters: if a ZH article has
      # halfwidth punctuation, _gen_en_pages.py would mirror it into the EN
      # files, then the halfwidth idempotency check downstream fails on both
      # ZH and EN files — cascading 2x failures that confused authors into
      # thinking the EN gen was broken. Convert first, then mirror.
      - name: Run halfwidth idempotency check (first)
        run: |
          python halfwidth_to_fullwidth.py --dry-run
          OUTPUT=$(python halfwidth_to_fullwidth.py --dry-run | tail -1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE 'WOULD WRITE: 0 files'; then
            echo "✓ All half-width punctuation already converted"
          else
            echo "✗ Half-width punctuation found — run python halfwidth_to_fullwidth.py before pushing"
            exit 1
          fi

      # ── Drift checks: regenerate auto-built artifacts and fail if any drifted ──
      # Catches the case where author edited an article but forgot to re-run
      # the generator + apply scripts.
      # OG image existence is checked later by _check_og_images.py; the binary
      # renderer is intentionally not part of drift detection because font
      # rasterization differs across Windows author machines and Ubuntu CI.
      #
      # v37.46: include _apply_*.py and _extract_critical_css.py to match the
      # local 18-step author chain. Previously CI only ran the 12 _gen_*.py,
      # which meant CI's regenerated EN files lacked the skip-link injection,
      # critical-css inline, etc. — causing a Windows↔Linux drift on every
      # push that the bot had to auto-fix post-hoc. Adding them here lets
      # the drift check pass cleanly on the first push.
      - name: Drift check — auto-regenerated artifacts
        run: |
          # v37.7: parallelize independent generators. _gen_en_pages.py must
          # finish before _gen_csp_hashes.py (CSP hashes the EN mirror's inline
          # scripts), so those stay serial.
          # v37.46: check each waited-for PID individually. The previous
          # `wait $PID1 $PID2` form returned only the exit code of the LAST
          # PID arg, silently swallowing failures of the earlier one.
          python _gen_feeds.py &
          PID_FEEDS=$!
          python _gen_related.py &
          PID_REL=$!
          wait $PID_FEEDS; FEEDS_RC=$?
          wait $PID_REL; REL_RC=$?
          if [ $FEEDS_RC -ne 0 ] || [ $REL_RC -ne 0 ]; then
            echo "::error::Parallel generator failed: _gen_feeds.py exit=$FEEDS_RC _gen_related.py exit=$REL_RC"
            exit 1
          fi
          python _gen_serp_meta.py
          python _gen_faqpage_jsonld.py
          python _gen_en_pages.py
          python _gen_search_index.py
          python _gen_api_content_snapshot.py
          python _gen_llms_txt.py
          python _gen_opensearch.py
          python _gen_profile_schema.py
          python _gen_site_graph.py
          python _gen_route_canonicals.py
          # Apply scripts — idempotent via SENTINEL gates, but must run after
          # _gen_en_pages.py so the EN mirror also receives skip-link / a11y.
          python _apply_i_series.py
          python _apply_a11y_vt.py
          python _apply_f10_image_priority.py
          # _extract_critical_css.py BEFORE _gen_csp_hashes.py — it injects an
          # inline <style data-critical-css> whose SHA-256 must be in the CSP
          # allowlist. If csp_hashes runs first, middleware.js lists the hash of
          # the *previous* critical-CSS block; whenever app.css/article.css
          # changes (so the extracted critical CSS changes), that hash goes
          # stale and CI drifts on middleware.js. csp_hashes MUST be the very
          # last build step so it hashes the final inline content of every page.
          python _extract_critical_css.py
          python _gen_csp_hashes.py
          if ! git diff --quiet; then
            echo "::warning::Auto-regenerated artifacts drifted from committed copies. Run the generator scripts locally before pushing:"
            echo "::warning::  python _gen_feeds.py && python _gen_related.py && python _gen_serp_meta.py && python _gen_faqpage_jsonld.py && python _gen_en_pages.py && python _gen_search_index.py && python _gen_api_content_snapshot.py && python _gen_llms_txt.py && python _gen_opensearch.py && python _gen_profile_schema.py && python _gen_site_graph.py && python _gen_route_canonicals.py && python _apply_i_series.py && python _apply_a11y_vt.py && python _apply_f10_image_priority.py && python _extract_critical_css.py && python _gen_csp_hashes.py"
            git diff --stat
            exit 1
          fi

      - name: Run validate.py
        run: python validate.py

      - name: Run full static quality gate
        run: python _check_all.py --quick

      - name: Run halfwidth idempotency check (second — after EN mirror)
        run: |
          python halfwidth_to_fullwidth.py --dry-run
          # If the dry run reports ANY replacement count > 0 the diff
          # would land — fail the build so author runs the real script.
          OUTPUT=$(python halfwidth_to_fullwidth.py --dry-run | tail -1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE 'WOULD WRITE: 0 files'; then
            echo "✓ All half-width punctuation already converted"
          else
            echo "✗ Half-width punctuation found — run python halfwidth_to_fullwidth.py before pushing"
            exit 1
          fi

      # ── Ported from DermNotes (2026-05): 15 deeper check scripts ──
      # Non-blocking initially so known issues in stub articles don't break CI.
      # Flip `|| true` to hard-fail once stubs are completed or removed.
      - name: Deep SEO/quality checks (DermNotes ported)
        run: |
          echo "=== _check_meta.py ===" && python _check_meta.py || echo "::warning::meta check has issues"
          echo "=== _check_sitemap.py ===" && python _check_sitemap.py || echo "::warning::sitemap check has issues"
          echo "=== _check_metadata_uniqueness.py ===" && python _check_metadata_uniqueness.py || echo "::warning::duplicate metadata found"
          echo "=== _check_internal_links.py ===" && python _check_internal_links.py || echo "::warning::internal-link issues"
          echo "=== _check_static_a11y.py ===" && python _check_static_a11y.py || echo "::warning::a11y issues (mostly admin.html dashboard)"
          echo "=== _check_articles.py ===" && python _check_articles.py || echo "::warning::DN.ARTICLES catalog issue"
          echo "=== _check_robots.py ===" && python _check_robots.py || echo "::warning::robots.txt issue"
          echo "=== _check_pwa.py ===" && python _check_pwa.py || echo "::warning::PWA manifest/SW/offline issue"
          echo "=== _check_bilingual_attrs.py ===" && python _check_bilingual_attrs.py || echo "::warning::bilingual attribute mismatch"
          echo "=== _check_secrets.py ===" && python _check_secrets.py || echo "::error::SECRET LEAK DETECTED"
          echo "=== _check_text_integrity.py ===" && python _check_text_integrity.py || echo "::warning::mojibake / encoding issue"
          echo "=== _check_balance.py ===" && python _check_balance.py || echo "::warning::blog-shared.js delimiter imbalance"
          echo "=== _check_button_types.py ===" && python _check_button_types.py || echo "::warning::button missing explicit type"
          echo "=== _check_external_links.py ===" && python _check_external_links.py || echo "::warning::target=_blank missing rel=noopener"
          echo "=== _check_index_boundaries.py ===" && python _check_index_boundaries.py || echo "::warning::indexable/private page boundary mismatch"
          echo "=== _check_inline_events.py ===" && python _check_inline_events.py || echo "::warning::inline event handlers (CSP)"
          echo "=== _check_performance_budget.py ===" && python _check_performance_budget.py || echo "::warning::performance budget exceeded"
          echo "=== _check_third_party.py ===" && python _check_third_party.py || echo "::warning::third-party loading policy violation"
          echo "=== _check_en_internal_links.py ===" && python _check_en_internal_links.py || echo "::warning::EN mirror links escape /en/"
          echo "=== _check_js_syntax.py ===" && python _check_js_syntax.py || echo "::warning::JS syntax error"
          echo "=== _check_syntax_residue.py ===" && python _check_syntax_residue.py || echo "::warning::duplicated-key syntax residue"
          echo "=== _check_inline_scripts.py ===" && python _check_inline_scripts.py || echo "::warning::inline script delimiter imbalance"
          echo "=== _check_article_listings.py ===" && python _check_article_listings.py || echo "::error::Article missing from listing page — homepage/blog-index/topics drift"
          echo "=== _check_link_orphans.py ===" && python _check_link_orphans.py || echo "::warning::Article has no static inbound peer link — add a cross-reference for topical authority"
          echo "=== _check_og_images.py ===" && python _check_og_images.py || echo "::error::Published article missing /assets/og/<slug>.png — run python _gen_og_images.py"
          echo "=== _check_dead_anchors.py ===" && python _check_dead_anchors.py || echo "::warning::In-page #anchor without matching id (broken TOC jump)"
          echo "=== _check_article_footer.py ===" && python _check_article_footer.py || echo "::error::Article missing the magazine footer (disclaimer + home nav)"
          echo "=== _check_image_sizes.py ===" && python _check_image_sizes.py || echo "::warning::<img src> serves more bytes than display dimensions warrant — point at a smaller variant"
          echo "=== _check_svg_a11y.py ===" && python _check_svg_a11y.py || echo "::warning::SVG figure missing <desc> / role=img / aria-hidden (image SERP + a11y gap)"
          echo "=== _check_hreflang.py ===" && python _check_hreflang.py || echo "::error::Hreflang pair broken — language clustering will drop"
          echo "=== _check_search_index.py ===" && python _check_search_index.py || echo "::error::Search index drifted from published bilingual catalog"
          echo "=== _check_faq_schema.py ===" && python _check_faq_schema.py || echo "::error::FAQPage rich-result schema boundary/payload issue"
          echo "=== _check_route_canonicals.py ===" && python _check_route_canonicals.py || echo "::error::Redirecting route signal found in crawler-facing artifacts"
          echo "=== _check_stub_exposure.py ===" && python _check_stub_exposure.py || echo "::error::Public source HTML links to noindex/WIP stub"

      - name: JSON-LD parse check
        run: |
          python -X utf8 -c "
          import json, re, glob, sys
          errors = 0
          pattern = re.compile(r'<script\\b[^>]*\\btype=[\"\\']application/ld\\+json[\"\\'][^>]*>(.*?)</script>', re.DOTALL | re.I)
          for fp in glob.glob('**/*.html', recursive=True):
              text = open(fp, encoding='utf-8').read()
              for i, b in enumerate(pattern.findall(text)):
                  try: json.loads(b.strip())
                  except Exception as e:
                      print(f'  FAIL {fp}#LD{i+1}: {e}')
                      errors += 1
          sys.exit(1 if errors else 0)
          "

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run API contract tests
        run: npm run test:api

      - name: Run SEO browser smoke tests
        run: npm run test:seo

  indexnow:
    name: IndexNow ping (Bing / Yandex / Naver)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # v37.44 — auto-notify IndexNow-subscribing engines on every push to
    # main. Vercel deploy takes ~30-60 s; we wait then ping. Bing usually
    # indexes within minutes after this. Google doesn't participate in
    # IndexNow (use GSC URL Inspection separately).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Wait for Vercel deploy
        run: sleep 75
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ping IndexNow with all published URLs
        run: |
          python <<'PY'
          import json
          import re
          import urllib.request

          HOST = 'hsiao.chendermatologist.com'
          KEY  = 'bfc071112dd2988a75988a1249d0ce44'   # matches /<key>.txt at root

          # Parse DN.ARTICLES minus DN.STUB_SLUGS for the published slug list.
          with open('blog/blog-shared.js', encoding='utf-8') as f:
              js = f.read()
          m_arts = re.search(r'DN\.ARTICLES\s*=\s*\[(.*?)\];', js, re.DOTALL)
          slugs = set(re.findall(r"slug:\s*'([^']+)'", m_arts.group(1))) if m_arts else set()
          m_stubs = re.search(r'DN\.STUB_SLUGS\s*=\s*new\s+Set\(\s*\[([\s\S]*?)\]', js)
          stubs = set(re.findall(r"'([^']+)'", m_stubs.group(1))) if m_stubs else set()
          m_en_stubs = re.search(r'DN\.EN_STUB_SLUGS\s*=\s*new\s+Set\(\s*\[([\s\S]*?)\]', js)
          en_stubs = set(re.findall(r"'([^']+)'", m_en_stubs.group(1))) if m_en_stubs else set()
          published = sorted(slugs - stubs)

          urls = [
              f'https://{HOST}/',
              f'https://{HOST}/blog',
              f'https://{HOST}/blog/topics',
              f'https://{HOST}/about',
              f'https://{HOST}/tools',
              f'https://{HOST}/notes',
              f'https://{HOST}/privacy',
              f'https://{HOST}/sitemap.xml',
              f'https://{HOST}/llms.txt',
              f'https://{HOST}/opensearch.xml',
              f'https://{HOST}/blog/feed.xml',
              f'https://{HOST}/blog/atom.xml',
              f'https://{HOST}/blog/feed.json',
              f'https://{HOST}/assets/search-index.json',
              f'https://{HOST}/en',
              f'https://{HOST}/en/blog',
              f'https://{HOST}/en/blog/topics',
              f'https://{HOST}/en/about',
              f'https://{HOST}/en/tools',
              f'https://{HOST}/en/notes',
              f'https://{HOST}/en/privacy',
          ]
          for s in published:
              urls.append(f'https://{HOST}/blog/{s}')
              if s not in en_stubs:
                  urls.append(f'https://{HOST}/en/blog/{s}')

          payload = json.dumps({
              'host': HOST,
              'key': KEY,
              'keyLocation': f'https://{HOST}/{KEY}.txt',
              'urlList': urls,
          }).encode('utf-8')
          req = urllib.request.Request(
              'https://api.indexnow.org/IndexNow',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f'IndexNow HTTP {r.status} — {len(urls)} URLs sent')
          except Exception as e:
              print(f'::warning::IndexNow ping failed: {e}')
          PY

  live-indexability:
    name: Live indexability audit
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for Vercel deploy (90s)
        run: sleep 90

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify production sitemap URLs are indexable
        run: python _check_live_indexability.py

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Don't block CI on Lighthouse — production scores fluctuate with
    # network/timing and small regressions shouldn't gate a deploy. The
    # report itself is the value (uploaded as artifact); we just want
    # visibility, not a hard gate. Switch to false once thresholds stabilise.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for Vercel deploy (75s)
        run: sleep 75

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://hsiao.chendermatologist.com/
            https://hsiao.chendermatologist.com/blog/
            https://hsiao.chendermatologist.com/blog/dry-eye-myths
            https://hsiao.chendermatologist.com/blog/pediatric-myopia-control
            https://hsiao.chendermatologist.com/blog/floaters-retinal-detachment
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/workflows/lighthouserc.json

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check for broken internal links
        run: |
          # validate.py already does internal link checking against the
          # filesystem. Just re-run with strict mode so warnings count.
          python validate.py --strict || echo "::warning::SEO/link warnings present"

  axe-a11y:
    name: A11y scan (axe-core)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for Vercel deploy (60s)
        run: sleep 60

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install axe-cli + Puppeteer
        run: npm install -g @axe-core/cli puppeteer

      - name: Run axe-core on production URLs
        # v37.20: re-enabled color-contrast (was disabled while warm-beige
        # palette had #8b8378 muted text ~4.3:1 on #faf7f2 — just under AA).
        # `--muted` was darkened to #6e6759 (~5.6:1) in app.css to clear AA.
        # Removed `--exit` so axe still warns visibly without blocking the
        # whole quality job — most pages PASS now; any new violation needs
        # author attention but not a hard merge block.
        run: |
          axe \
            https://hsiao.chendermatologist.com/ \
            https://hsiao.chendermatologist.com/blog/ \
            https://hsiao.chendermatologist.com/blog/dry-eye-myths \
            https://hsiao.chendermatologist.com/blog/pediatric-myopia-control \
            https://hsiao.chendermatologist.com/blog/floaters-retinal-detachment \
            https://hsiao.chendermatologist.com/blog/lacrimal-gland-tumor \
            https://hsiao.chendermatologist.com/tools \
            --tags wcag2a,wcag2aa,best-practice \
            --save axe-report.json || echo "::warning::axe-core violations found — see report"

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-a11y-report-${{ github.run_id }}
          path: axe-report.json
          retention-days: 30
