name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Replace reviewed PNG baselines and commit them'
        required: false
        default: 'false'

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    if: inputs.force_update != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for Vercel deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 75

      - name: Require the complete reviewed baseline set
        run: |
          EXPECTED=21
          ACTUAL=$(find tests/visual/snapshots -name '*.png' | wc -l)
          echo "Found $ACTUAL / $EXPECTED baseline PNGs."
          test "$ACTUAL" -eq "$EXPECTED"

      - name: Run visual diff
        run: npx playwright test tests/visual/ --reporter=list

      - name: Upload diff snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  update-baselines:
    if: github.event_name == 'workflow_dispatch' && inputs.force_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Replace baselines
        run: npx playwright test tests/visual/ --update-snapshots --reporter=list

      - name: Commit reviewed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test(hsiaoeye): refresh reviewed visual baselines [skip ci]"
            git push origin HEAD:main
          fi
