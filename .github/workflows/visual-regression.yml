name: Visual regression

# Push only: the exact candidate SHA (codex/**) or main is compared once.
# A pull_request run tested the same deployment again and doubled the requests
# to it; delivery evidence (_delivery.py, _vercel_gate.cjs) only reads push runs.
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Generate candidate PNG baselines as a review artifact'
        required: false
        default: 'false'

concurrency:
  # A group holds one running and one pending run; a newer pending run
  # replaces the older one even without cancel-in-progress. Every main run
  # therefore gets its own group, so none is ever cancelled.
  group: visual-regression-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  visual:
    if: inputs.force_update != 'true'
    runs-on: ubuntu-24.04  # pinned: Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04)
    # Up to 40 minutes of the budget is the wait for a queued Hobby Preview build.
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve exact candidate Preview
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python _delivery.py preview "$GITHUB_SHA" --wait 2400 > "$RUNNER_TEMP/visual-preview-url"
          echo "PW_BASE_URL=$(cat "$RUNNER_TEMP/visual-preview-url")" >> "$GITHUB_ENV"

      - name: Require exact production deployment
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python _delivery.py production "$GITHUB_SHA" --wait 2400

      - name: Require the complete reviewed baseline set
        run: |
          EXPECTED=27
          ACTUAL=$(find tests/visual/snapshots -name '*.png' | wc -l)
          echo "Found $ACTUAL / $EXPECTED baseline PNGs."
          test "$ACTUAL" -eq "$EXPECTED"

      - name: Run visual diff
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ github.ref != 'refs/heads/main' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        run: npx playwright test tests/visual/ --reporter=list

      - name: Upload diff snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  update-baselines:
    if: github.event_name == 'workflow_dispatch' && inputs.force_update == 'true' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-24.04  # pinned: Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04)
    # Up to 40 minutes of the budget is the wait for a queued Hobby Preview build.
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Replace baselines
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ github.ref != 'refs/heads/main' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(python _delivery.py preview "$GITHUB_SHA" --wait 2400)
          PW_BASE_URL="$URL" npx playwright test tests/visual/ --update-snapshots --reporter=list

      - name: Upload candidate baselines for review
        uses: actions/upload-artifact@v4
        with:
          name: candidate-baselines-${{ github.sha }}
          path: tests/visual/snapshots/
          if-no-files-found: error
          retention-days: 14
