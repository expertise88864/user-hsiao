name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Visual regression: Playwright screenshots vs git-tracked baselines.
# Snapshots live under /tests/visual/snapshots/ and are committed.
# When a snapshot diff is found:
#   - On PR: posts a comment with the diff image attached.
#   - On main push: fails the workflow so the author updates the baselines.
#
# To update baselines locally:
#   npx playwright test --update-snapshots
#
# Free / self-hosted (no Percy / Chromatic dependency).
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Wait for Vercel deploy (60s)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 60

      - name: Run visual regression tests
        env:
          PW_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://hsiao.chendermatologist.com' || 'https://hsiao.chendermatologist.com' }}
        run: npx playwright test tests/visual/ --reporter=list

      - name: Upload diff snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.run_id }}
          path: |
            test-results/
            tests/visual/snapshots/
          retention-days: 14
