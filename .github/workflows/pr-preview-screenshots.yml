name: PR preview screenshots
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  deployments: read
jobs:
  preview-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Resolve exact PR Preview and take read-only screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          URL=$(python _delivery.py preview "$CANDIDATE_SHA" --wait 600)
          PW_BASE_URL="$URL" node _delivery_preview.cjs
      - name: Upload screenshots (never baseline updates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.head.sha }}
          path: delivery-preview/
          if-no-files-found: error
          retention-days: 14
