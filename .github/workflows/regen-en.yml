name: Regenerate /en/ mirror

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.html'
      - 'about.html'
      - 'privacy.html'
      - 'tools.html'
      - 'notes.html'
      - 'index.html'
      - '_gen_en_pages.py'
      - '_gen_profile_schema.py'
      - '_gen_site_graph.py'
      - '_gen_route_canonicals.py'
      - '_gen_csp_hashes.py'
  workflow_dispatch:

# Skip if commit is from this workflow itself (avoids loop)
concurrency:
  group: regen-en
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  regen:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'ci: regen /en/') && !contains(github.event.head_commit.message, 'admin: regen')"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Need write permission to push the regenerated /en/ files back
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install beautifulsoup4

      - name: Regenerate English mirror and dependent artifacts
        run: |
          python _gen_en_pages.py
          python _gen_profile_schema.py
          python _gen_site_graph.py
          python _gen_route_canonicals.py
          python _gen_csp_hashes.py

      - name: Commit regenerated artifacts if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/ middleware.js
          if git diff --cached --quiet; then
            echo "No regenerated artifact changes to commit."
            exit 0
          fi
          git commit -m "ci: regen /en/ mirror and dependents [skip ci]"
          # Pull --rebase first in case admin pushed during regen (rare)
          git pull --rebase origin main
          git push
