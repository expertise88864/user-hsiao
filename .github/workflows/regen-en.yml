name: Regenerate /en/ mirror

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.html'
      - 'about.html'
      - 'privacy.html'
      - 'tools.html'
      - 'notes.html'
      - 'index.html'
      - 'blog/blog-shared.js'
      - 'preflight.py'
      - '_normalize_*.py'
      - '_articles_field.py'
      - '_gen_llms_full_txt.py'
      - '_inject_speed_insights.py'
      - '.github/workflows/quality.yml'
      - 'halfwidth_to_fullwidth.py'
      - '_gen_feeds.py'
      - '_gen_related.py'
      - '_gen_serp_meta.py'
      - '_gen_en_pages.py'
      - '_gen_faqpage_jsonld.py'
      - '_gen_search_index.py'
      - '_gen_profile_schema.py'
      - '_gen_site_graph.py'
      - '_gen_route_canonicals.py'
      - '_gen_api_content_snapshot.py'
      - '_gen_llms_txt.py'
      - '_gen_opensearch.py'
      - '_apply_i_series.py'
      - '_apply_a11y_vt.py'
      - '_apply_trusted_types.py'
      - '_apply_f10_image_priority.py'
      - '_extract_critical_css.py'
      - '_gen_csp_hashes.py'
  workflow_dispatch:

# Read-only generation check: corrections must use the normal review/CI push gate.
concurrency:
  group: regen-en
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # This job never publishes unvalidated generated changes.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 Pillow

      - name: Regenerate all dependent artifacts
        run: |
          python preflight.py --run-chain

      - name: Detect generated drift
        id: drift
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > "$RUNNER_TEMP/generated-artifacts.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated correction for review
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/generated-artifacts.patch
          if-no-files-found: error
          retention-days: 14

      - name: Require committed artifacts to be current
        if: steps.drift.outputs.changed == 'true'
        run: |
          echo "::error::Generated artifacts drifted. Apply the patch locally, review it, pass full CI-equivalent checks, then push and verify the new SHA."
          exit 1
