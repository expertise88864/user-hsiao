name: Regenerate /en/ mirror

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.html'
      - 'about.html'
      - 'privacy.html'
      - 'tools.html'
      - 'notes.html'
      - 'index.html'
      - 'blog/blog-shared.js'
      - 'preflight.py'
      - '_normalize_*.py'
      - '_articles_field.py'
      - '_gen_llms_full_txt.py'
      - '_inject_speed_insights.py'
      - '.github/workflows/quality.yml'
      - 'halfwidth_to_fullwidth.py'
      - '_gen_feeds.py'
      - '_gen_related.py'
      - '_gen_serp_meta.py'
      - '_gen_en_pages.py'
      - '_gen_faqpage_jsonld.py'
      - '_gen_search_index.py'
      - '_gen_profile_schema.py'
      - '_gen_site_graph.py'
      - '_gen_route_canonicals.py'
      - '_gen_api_content_snapshot.py'
      - '_gen_llms_txt.py'
      - '_gen_opensearch.py'
      - '_apply_i_series.py'
      - '_apply_a11y_vt.py'
      - '_apply_trusted_types.py'
      - '_apply_f10_image_priority.py'
      - '_extract_critical_css.py'
      - '_gen_csp_hashes.py'
  workflow_dispatch:

# Skip if commit is from this workflow itself (avoids loop)
concurrency:
  group: regen-en
  cancel-in-progress: false

jobs:
  regen:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'ci: regen /en/') && !contains(github.event.head_commit.message, 'admin: regen')"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Need write permission to push the regenerated /en/ files back
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 Pillow

      - name: Regenerate all dependent artifacts
        run: |
          python preflight.py --run-chain

      - name: Commit regenerated artifacts if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No regenerated artifact changes to commit."
            exit 0
          fi
          git commit -m "ci: regen /en/ mirror and dependents"
          # Pull --rebase first in case admin pushed during regen (rare)
          git pull --rebase origin main
          git push
