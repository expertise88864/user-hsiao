name: Size budget

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

# Tracks total page-weight per route + per-asset size to flag regressions.
# Outputs the top 25 largest assets and any that crossed a budget threshold.

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-24.04  # pinned: Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compute asset budget
        run: |
          python _check_size_budget.py
