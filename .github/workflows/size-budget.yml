name: Size budget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Tracks total page-weight per route + per-asset size to flag regressions.
# Outputs a comment on PRs listing the top 10 largest assets and any that
# crossed a budget threshold.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute asset budget
        run: |
          python3 <<'PY'
          import os, gzip, json
          BUDGETS = {
              # path -> (raw_kb, gzip_kb) — fail-on-exceed
              'blog/blog-shared.js': (180, 50),
              'assets/app.css':      (90,  20),
              'assets/article.css':  (40,  10),
              'sw.js':               (16,  6),
              'middleware.js':       (8,   3),
          }
          warnings = []
          report = []
          # Walk all relevant assets
          all_assets = []
          for root, _, files in os.walk('.'):
              if any(s in root for s in ['.git', '__pycache__', 'node_modules', 'tests', 'test-results']):
                  continue
              for f in files:
                  if f.endswith(('.js', '.css', '.html')):
                      p = os.path.join(root, f).lstrip('./')
                      with open(p, 'rb') as fp: data = fp.read()
                      raw_kb = len(data) / 1024
                      gz_kb  = len(gzip.compress(data, compresslevel=9)) / 1024
                      all_assets.append((p, raw_kb, gz_kb))

          all_assets.sort(key=lambda x: -x[2])
          report.append(f"{'PATH':<60} {'RAW kB':>8} {'GZIP kB':>8}")
          report.append('-' * 80)
          for p, r, g in all_assets[:25]:
              report.append(f"{p:<60} {r:>8.1f} {g:>8.1f}")

          # Budget check
          for path, (max_raw, max_gz) in BUDGETS.items():
              for p, r, g in all_assets:
                  if p == path:
                      if r > max_raw: warnings.append(f"  ⚠ {p}: {r:.1f} kB raw exceeds budget {max_raw} kB")
                      if g > max_gz:  warnings.append(f"  ⚠ {p}: {g:.1f} kB gzip exceeds budget {max_gz} kB")

          print('\n'.join(report))
          if warnings:
              print('\n=== BUDGET VIOLATIONS ===')
              for w in warnings: print(w)
              # Soft-fail (warn) for now — flip to hard-fail once budgets are tuned.
              import sys
              # sys.exit(1)
          else:
              print('\n✓ All asset budgets within limits')
          PY
