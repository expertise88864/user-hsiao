<script type="module">
  // ─────────────────────────────────────────────────────────────────────
  // 3D eye anatomy — v33 OffscreenCanvas + Worker.
  //
  // Renders Three.js on a Worker thread so the main thread stays free
  // for user input / scrolling / other widgets. Falls back to inline
  // main-thread rendering when Worker / OffscreenCanvas unsupported.
  // ─────────────────────────────────────────────────────────────────────

  const canvas = document.getElementById('eye-canvas');
  const info = document.getElementById('eye-renderer-info');

  // Try Worker + OffscreenCanvas first
  let usingWorker = false;
  if (typeof Worker !== 'undefined' && 'transferControlToOffscreen' in canvas) {
    try {
      const worker = new Worker('/tools/eye-3d-worker.js?v=20260667', { type: 'module' });
      const offscreen = canvas.transferControlToOffscreen();
      worker.postMessage({
        type: 'init', canvas: offscreen,
        width: canvas.clientWidth, height: canvas.clientHeight,
        dpr: devicePixelRatio || 1,
      }, [offscreen]);

      worker.addEventListener('message', (e) => {
        const m = e.data;
        if (m.type === 'ready') {
          info.innerHTML = (m.renderer === 'webgpu' ? '⚡ WebGPU' : '🌐 WebGL2') + ' · Worker';
        } else if (m.type === 'pick') {
          highlightPart(m.id);
        }
      });

      // Wire input events to the worker
      let last = { x: 0, y: 0, id: null };
      canvas.addEventListener('pointerdown', (e) => {
        canvas.setPointerCapture(e.pointerId);
        last = { x: e.clientX, y: e.clientY, id: e.pointerId };
        worker.postMessage({ type: 'pointerdown', x: e.offsetX, y: e.offsetY, pointerId: e.pointerId });
      });
      canvas.addEventListener('pointermove', (e) => {
        if (last.id !== e.pointerId) return;
        const dx = e.clientX - last.x, dy = e.clientY - last.y;
        last.x = e.clientX; last.y = e.clientY;
        worker.postMessage({ type: 'pointermove', x: e.offsetX, y: e.offsetY, dx, dy, pointerId: e.pointerId });
      });
      canvas.addEventListener('pointerup', (e) => {
        worker.postMessage({ type: 'pointerup', pointerId: e.pointerId });
        last.id = null;
      });
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        worker.postMessage({ type: 'wheel', dy: e.deltaY });
      }, { passive: false });
      // Click distinct from drag (small movement only)
      let downAt = { x: 0, y: 0 };
      canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
      canvas.addEventListener('click', (e) => {
        const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
        if (moved < 5) worker.postMessage({ type: 'click', x: e.offsetX, y: e.offsetY });
      });

      addEventListener('resize', () => {
        worker.postMessage({ type: 'resize', width: canvas.clientWidth, height: canvas.clientHeight });
      });

      // Buttons
      document.getElementById('btn-reset').addEventListener('click', () => worker.postMessage({ type: 'reset' }));
      document.getElementById('btn-section').addEventListener('click', (e) => {
        const on = e.target.dataset.on === 'true';
        e.target.dataset.on = on ? 'false' : 'true';
        e.target.classList.toggle('active', !on);
        worker.postMessage({ type: 'section', on: !on });
      });
      document.getElementById('btn-labels').addEventListener('click', (e) => {
        const on = e.target.dataset.on === 'true';
        e.target.dataset.on = on ? 'false' : 'true';
        e.target.classList.toggle('active', !on);
        document.querySelector('.eye-side').style.display = on ? 'none' : '';
      });

      // Sidebar click → tell worker to highlight + scroll
      document.getElementById('part-list').addEventListener('click', (e) => {
        const part = e.target.closest('.part');
        if (part) {
          worker.postMessage({ type: 'highlight', id: part.dataset.id });
          highlightPart(part.dataset.id);
        }
      });

      function highlightPart(id) {
        document.querySelectorAll('#part-list .part').forEach(p => p.classList.toggle('active', p.dataset.id === id));
        const el = document.querySelector('#part-list .part[data-id="' + id + '"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      usingWorker = true;
    } catch (e) {
      console.warn('Worker init failed, falling back to main thread', e);
    }
  }

  // ─── Main-thread fallback (Worker not available) ────────────────────
  if (!usingWorker) {
    info.innerHTML = '🌐 Main thread';
  // ─────────────────────────────────────────────────────────────────────
  // 3D eye anatomy — Three.js (loaded from esm CDN), with WebGPURenderer
  // when supported, falls back to WebGLRenderer.
  //
  // Geometry is procedural (no external GLB) — stack of spheres + cylinder
  // approximating: cornea, iris, lens, vitreous, retina, optic nerve, sclera.
  // Click → highlights structure + scrolls to its info panel.
  // ─────────────────────────────────────────────────────────────────────

  const PARTS = [
    { id: 'cornea',      zh: '角膜',     lat: 'Cornea',         color: '#a4c4dd', desc: '透明前段,負責 ⅔ 的屈光力。受傷易感染或潰瘍。', pos: [0, 0, 1.0], scale: [0.4, 0.4, 0.2] },
    { id: 'iris',        zh: '虹膜',     lat: 'Iris',           color: '#8b6f3a', desc: '控制瞳孔大小調節進光量,顏色由黑色素決定。', pos: [0, 0, 0.85], scale: [0.55, 0.55, 0.05] },
    { id: 'pupil',       zh: '瞳孔',     lat: 'Pupil',          color: '#0f172a', desc: '虹膜中央的開口,光線進入眼球的通道。', pos: [0, 0, 0.86], scale: [0.18, 0.18, 0.05] },
    { id: 'lens',        zh: '水晶體',   lat: 'Lens',           color: '#b8cfe3', desc: '可調節屈光的透明組織,白內障即水晶體混濁。', pos: [0, 0, 0.65], scale: [0.45, 0.45, 0.2] },
    { id: 'vitreous',    zh: '玻璃體',   lat: 'Vitreous body',  color: '#d6e4f0', desc: '填充眼球後段的透明膠狀物,老化會液化產生飛蚊症。', pos: [0, 0, 0.0], scale: [0.85, 0.85, 0.85] },
    { id: 'retina',      zh: '視網膜',   lat: 'Retina',         color: '#fbbf24', desc: '感光神經組織,負責將光訊號轉成神經訊號。剝離為急症。', pos: [0, 0, -0.05], scale: [0.95, 0.95, 0.95] },
    { id: 'macula',      zh: '黃斑部',   lat: 'Macula',         color: '#dc2626', desc: '視網膜中央視力最敏銳的區域,負責中央視野與色彩辨識。', pos: [0, 0, -0.85], scale: [0.18, 0.18, 0.06] },
    { id: 'optic-nerve', zh: '視神經',   lat: 'Optic nerve',    color: '#fde68a', desc: '將視網膜訊號傳到大腦的神經束,青光眼會破壞此處。', pos: [0.15, 0, -0.95], scale: [0.18, 0.18, 0.5] },
    { id: 'sclera',      zh: '鞏膜',     lat: 'Sclera',         color: '#fef3c7', desc: '眼球外層的白色保護膜,佔眼球表面 5/6。', pos: [0, 0, 0], scale: [1.0, 1.0, 1.0] },
  ];

  // Render parts list in sidebar
  const sidebar = document.getElementById('part-list');
  sidebar.innerHTML = PARTS.map(p => `
    <div class="part" data-id="${p.id}" tabindex="0">
      <h3>${p.zh} <span class="lat">${p.lat}</span></h3>
      <p>${p.desc}</p>
    </div>
  `).join('');

  const canvas = document.getElementById('eye-canvas');
  const info = document.getElementById('eye-renderer-info');

  let renderer, scene, camera, root, raycaster, mouse;
  let useWebGPU = false;

  async function init() {
    let three, controlsModule;
    try {
      three = await import('https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js');
      controlsModule = await import('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js');
    } catch (e) {
      info.innerHTML = '⚠ Three.js 載入失敗,請檢查網路連線';
      return;
    }
    const THREE = three;
    const { OrbitControls } = controlsModule;

    // Try WebGPU first
    try {
      if (navigator.gpu && THREE.WebGPURenderer) {
        renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
        await renderer.init();
        useWebGPU = true;
        info.innerHTML = '⚡ WebGPU';
      }
    } catch (e) {}

    if (!renderer) {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      info.innerHTML = '🌐 WebGL2';
    }

    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(2, 2, 2);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xa4c4dd, 0.6);
    rim.position.set(-2, -1, -1);
    scene.add(rim);

    camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.01, 100);
    camera.position.set(2.2, 1.0, 2.4);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // Build eye geometry
    root = new THREE.Group();
    scene.add(root);

    const meshById = {};

    // Sclera (the outer ball — semi-transparent)
    const scleraMat = new THREE.MeshPhongMaterial({
      color: 0xfef3c7, transparent: true, opacity: 0.18, side: THREE.DoubleSide,
    });
    const sclera = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), scleraMat);
    sclera.userData.id = 'sclera';
    root.add(sclera);
    meshById.sclera = sclera;

    // Vitreous (slightly inner ball)
    const vitreous = new THREE.Mesh(
      new THREE.SphereGeometry(0.85, 32, 32),
      new THREE.MeshPhongMaterial({ color: 0xd6e4f0, transparent: true, opacity: 0.12 })
    );
    vitreous.userData.id = 'vitreous';
    root.add(vitreous);
    meshById.vitreous = vitreous;

    // Retina (inner shell, only back half)
    const retinaGeom = new THREE.SphereGeometry(0.95, 32, 32, 0, Math.PI * 2, Math.PI / 2.4, Math.PI / 1.6);
    const retina = new THREE.Mesh(retinaGeom, new THREE.MeshPhongMaterial({ color: 0xfbbf24, side: THREE.BackSide, shininess: 50 }));
    retina.userData.id = 'retina';
    root.add(retina);
    meshById.retina = retina;

    // Macula (small red dot on retina, back of eye)
    const macula = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshPhongMaterial({ color: 0xdc2626 }));
    macula.position.set(0, 0, -0.86);
    macula.userData.id = 'macula';
    root.add(macula);
    meshById.macula = macula;

    // Optic nerve (cylinder out the back)
    const nerveGeom = new THREE.CylinderGeometry(0.1, 0.13, 0.6, 16);
    const nerve = new THREE.Mesh(nerveGeom, new THREE.MeshPhongMaterial({ color: 0xfde68a }));
    nerve.rotation.x = Math.PI / 2;
    nerve.position.set(0.12, 0, -1.2);
    nerve.userData.id = 'optic-nerve';
    root.add(nerve);
    meshById['optic-nerve'] = nerve;

    // Lens
    const lensGeom = new THREE.SphereGeometry(0.22, 32, 32);
    const lens = new THREE.Mesh(lensGeom, new THREE.MeshPhongMaterial({ color: 0xb8cfe3, transparent: true, opacity: 0.55, shininess: 100 }));
    lens.position.set(0, 0, 0.65);
    lens.scale.set(1, 1, 0.45);
    lens.userData.id = 'lens';
    root.add(lens);
    meshById.lens = lens;

    // Iris (ring)
    const irisGeom = new THREE.RingGeometry(0.18, 0.42, 32);
    const iris = new THREE.Mesh(irisGeom, new THREE.MeshPhongMaterial({ color: 0x8b6f3a, side: THREE.DoubleSide }));
    iris.position.set(0, 0, 0.78);
    iris.userData.id = 'iris';
    root.add(iris);
    meshById.iris = iris;

    // Pupil (dark disc inside iris hole)
    const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.18, 32), new THREE.MeshBasicMaterial({ color: 0x0f172a }));
    pupil.position.set(0, 0, 0.79);
    pupil.userData.id = 'pupil';
    root.add(pupil);
    meshById.pupil = pupil;

    // Cornea (curved cap)
    const corneaGeom = new THREE.SphereGeometry(0.42, 32, 32, 0, Math.PI * 2, 0, Math.PI / 3);
    const cornea = new THREE.Mesh(corneaGeom, new THREE.MeshPhongMaterial({ color: 0xa4c4dd, transparent: true, opacity: 0.35, shininess: 200 }));
    cornea.rotation.x = Math.PI;
    cornea.position.set(0, 0, 0.8);
    cornea.userData.id = 'cornea';
    root.add(cornea);
    meshById.cornea = cornea;

    // Click → highlight + scroll to part info
    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(root.children, false);
      if (hits.length) {
        const id = hits[0].object.userData.id;
        if (id) highlightPart(id);
      }
    });

    // Side panel click → highlight in 3D
    sidebar.addEventListener('click', (e) => {
      const part = e.target.closest('.part');
      if (part) highlightPart(part.dataset.id);
    });

    function highlightPart(id) {
      // Reset all
      sidebar.querySelectorAll('.part').forEach(p => p.classList.toggle('active', p.dataset.id === id));
      const el = sidebar.querySelector('.part[data-id="' + id + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });

      // Pulse opacity on the chosen mesh
      const mesh = meshById[id];
      if (!mesh || !mesh.material) return;
      const orig = mesh.material.opacity ?? 1;
      const wasTransparent = mesh.material.transparent;
      mesh.material.transparent = true;
      let t = 0;
      const pulse = setInterval(() => {
        mesh.material.opacity = orig + 0.4 * Math.sin(t / 60 * Math.PI);
        t += 16;
        if (t > 600) {
          clearInterval(pulse);
          mesh.material.opacity = orig;
          mesh.material.transparent = wasTransparent;
        }
      }, 16);
    }

    // Buttons
    document.getElementById('btn-reset').addEventListener('click', () => {
      camera.position.set(2.2, 1.0, 2.4);
      controls.target.set(0, 0, 0);
      controls.update();
    });
    document.getElementById('btn-section').addEventListener('click', (e) => {
      const on = e.target.dataset.on === 'true';
      e.target.dataset.on = on ? 'false' : 'true';
      e.target.classList.toggle('active', !on);
      // Cross-section: hide front half via clipping plane
      const plane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
      renderer.localClippingEnabled = !on;
      [sclera, vitreous].forEach(m => {
        m.material.clippingPlanes = on ? [] : [plane];
      });
    });
    document.getElementById('btn-labels').addEventListener('click', (e) => {
      const on = e.target.dataset.on === 'true';
      e.target.dataset.on = on ? 'false' : 'true';
      e.target.classList.toggle('active', !on);
      // Toggle the sidebar visibility
      document.querySelector('.eye-side').style.display = on ? 'none' : '';
    });

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      root.rotation.y += 0.0015;
      renderer.render(scene, camera);
    }
    animate();
  }

  // Boot main-thread fallback
  if (!('WebGL2RenderingContext' in window)) {
    canvas.parentElement.innerHTML = '<div class="no-gpu"><h3>瀏覽器不支援 WebGL 2</h3><p>請使用最新版的 Chrome / Firefox / Safari / Edge 瀏覽 3D 模型。</p></div>';
  } else {
    init();
  }
  } // ← close `if (!usingWorker)`
</script>
